[package]
name = "dmsh-sources"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dmsh-core = { version = "0.1.0", path = "../dmsh-core" }
futures-util = "0.3.34"
inotify = { version = "0.11.5", default-features = false, features = ["stream"] }
log = "0.4.34"
niri-ipc = "26.4.0"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "net", "time", "io-util", "sync", "macros", "process"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
